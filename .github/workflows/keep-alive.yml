name: Check bot service health

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-health-check
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: >-
          curl --fail --silent --show-error
          --max-time 90
          --retry 2
          --retry-delay 5
          https://p01--telegram-groq-bot--jbqdj6cx974n.code.run/healthz
