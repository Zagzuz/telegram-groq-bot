services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telegram_bot
      POSTGRES_USER: telegram_bot
      POSTGRES_PASSWORD: telegram_bot
    ports:
      - "5432:5432"
    volumes:
      - telegram_bot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_bot -d telegram_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://telegram_bot:telegram_bot@postgres:5432/telegram_bot
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  telegram_bot_postgres:
